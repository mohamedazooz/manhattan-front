# 1. Redirect HTTP (Port 80) -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name manhattanschool.net www.manhattanschool.net manhattanschool.com www.manhattanschool.com 102.206.132.212 localhost;

    # Allow Let's Encrypt renewal
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://www.manhattanschool.net$request_uri;
    }
}

# 2. Redirect HTTPS non-www -> HTTPS www.manhattanschool.net
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name manhattanschool.net;

    ssl_certificate     /etc/letsencrypt/live/manhattanschool.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/manhattanschool.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.manhattanschool.net$request_uri;
}

# 3. Main HTTPS Server (www.manhattanschool.net)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.manhattanschool.net;

    ssl_certificate     /etc/letsencrypt/live/manhattanschool.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/manhattanschool.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/manhattan/frontend/dist;
    index index.html;

    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Backend API Reverse Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Uploads directory
    location /uploads/ {
        alias /var/www/manhattan/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Static Assets Caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Favicon, Logo & Images in root
    location ~* \.(ico|svg|png|jpg|jpeg|webp|gif)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Block sensitive files
    location ~ /\.(env|git|htaccess|htpasswd) {
        deny all;
        return 404;
    }

    # Single Page Application fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}