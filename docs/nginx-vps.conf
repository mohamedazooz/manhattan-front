# Production nginx site config for Manhattan Language School
# Install: sudo cp docs/nginx-vps.conf /etc/nginx/sites-available/manhattan
#          sudo ln -sf /etc/nginx/sites-available/manhattan /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# SSL: replace ssl_certificate paths with your Let's Encrypt or provider certs,
#      or use certbot --nginx to auto-configure.

# Redirect bare domain to www
server {
    listen 80;
    listen [::]:80;
    server_name manhattanschool.net;
    return 301 https://www.manhattanschool.net$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.manhattanschool.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.manhattanschool.net;

    # SSL — replace with your certificate paths
    ssl_certificate     /etc/letsencrypt/live/www.manhattanschool.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.manhattanschool.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    root /var/www/manhattan/frontend/dist;
    index index.html;

    # API → NestJS backend (pm2 on port 5000)
    location /api {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Static uploads served by backend (optional if backend serves /uploads)
    location /uploads {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
